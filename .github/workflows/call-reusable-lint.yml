name: call-reusable-lint

on:
  pull_request:
    paths: [".github/workflows/**"]

permissions:
  contents: read

concurrency:
  group: call-reusable-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/reusable-lint.yml
    with:
      path: .github/workflows
