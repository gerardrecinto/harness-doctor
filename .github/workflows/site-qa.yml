name: Site QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  browser:
    name: On-demand Python demo (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install locked browser test dependency
        run: npm ci --prefix qa --ignore-scripts
      - name: Install Chromium
        run: qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify deferred download, real findings, no-JS and retry
        run: npm test --prefix qa
