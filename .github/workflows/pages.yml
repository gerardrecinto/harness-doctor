name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "src/**", "examples/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assemble site
        run: |
          mkdir -p _site/py _site/examples
          cp site/index.html site/og.png _site/
          for f in __init__ model rules ci engine report; do cp src/harness_doctor/$f.py _site/py/; done
          cp examples/bad/deploy.yaml _site/examples/bad.yaml
          cp examples/good/deploy.yaml _site/examples/good.yaml
          cp examples/bad/workflow.yml examples/bad/Jenkinsfile _site/examples/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
