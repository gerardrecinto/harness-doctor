name: harness-doctor
description: Lint Harness CI/CD pipeline YAML and report findings in the PR.
branding:
  icon: activity
  color: blue
inputs:
  path:
    description: Directory or file to check
    default: .harness
  fail-on:
    description: Lowest severity that fails the job (error, warning, info, never)
    default: error
  schema:
    description: Also validate against Harness's published JSON schema
    default: "false"
  sarif:
    description: Upload findings to GitHub code scanning
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install "${{ github.action_path }}[schema]"
    - shell: bash
      env:
        TARGET: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        harness-doctor check "$TARGET" --format sarif --fail-on never > harness-doctor.sarif || rm -f harness-doctor.sarif
        harness-doctor check "$TARGET" --format github --fail-on "$FAIL_ON"
    - if: ${{ !cancelled() && inputs.schema == 'true' }}
      shell: bash
      env:
        TARGET: ${{ inputs.path }}
      run: harness-doctor schema "$TARGET"
    - if: ${{ !cancelled() && inputs.sarif == 'true' && hashFiles('harness-doctor.sarif') != '' }}
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
      with:
        sarif_file: harness-doctor.sarif
        category: harness-doctor
